<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Test tastiera</title>
<style>
  body { margin: 0; padding: 16px; background: #1b1d22; color: #e6e6e6; font-family: Segoe UI, Arial, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: #aaa; font-size: 14px; }
  .riga { display: flex; gap: 4px; margin-bottom: 4px; }
  .t { flex: 1 1 0; min-width: 0; height: 42px; display: flex; align-items: center; justify-content: center;
       background: #30343c; border: 1px solid #444a55; border-radius: 5px; font-size: 12px; text-align: center;
       user-select: none; transition: background .1s; }
  .t.premuto { background: #f2c94c; color: #000; }
  .t.ok { background: #2e9d5b; color: #fff; border-color: #2e9d5b; }
  #stato { margin-top: 14px; font-size: 15px; }
  #ultimo { color: #f2c94c; }
  button { margin-top: 10px; padding: 6px 14px; font-size: 14px; }
</style>
</head>
<body>
<h1>Test tastiera (funziona offline)</h1>
<p>Premi tutti i tasti uno alla volta: ognuno diventa <b style="color:#2e9d5b">verde</b> quando funziona. I tasti Fn e alcuni tasti speciali non vengono rilevati dal browser: provali a parte (luminosita', volume, Fn+F5).</p>
<div id="tastiera"></div>
<div id="stato">Tasti funzionanti: <b id="conta">0</b> / <span id="totale"></span> &nbsp; Ultimo tasto: <span id="ultimo">-</span></div>
<button onclick="location.reload()">Ricomincia</button>
<script>
  var righe = [
    [['Escape','Esc'],['F1','F1'],['F2','F2'],['F3','F3'],['F4','F4'],['F5','F5'],['F6','F6'],['F7','F7'],['F8','F8'],['F9','F9'],['F10','F10'],['F11','F11'],['F12','F12'],['Delete','Canc']],
    [['Backquote','\\'],['Digit1','1'],['Digit2','2'],['Digit3','3'],['Digit4','4'],['Digit5','5'],['Digit6','6'],['Digit7','7'],['Digit8','8'],['Digit9','9'],['Digit0','0'],['Minus',"'"],['Equal','ì'],['Backspace','Backspace']],
    [['Tab','Tab'],['KeyQ','Q'],['KeyW','W'],['KeyE','E'],['KeyR','R'],['KeyT','T'],['KeyY','Y'],['KeyU','U'],['KeyI','I'],['KeyO','O'],['KeyP','P'],['BracketLeft','è'],['BracketRight','+'],['Enter','Invio']],
    [['CapsLock','Bloc Maiusc'],['KeyA','A'],['KeyS','S'],['KeyD','D'],['KeyF','F'],['KeyG','G'],['KeyH','H'],['KeyJ','J'],['KeyK','K'],['KeyL','L'],['Semicolon','ò'],['Quote','à'],['Backslash','ù']],
    [['ShiftLeft','Maiusc sx'],['IntlBackslash','<'],['KeyZ','Z'],['KeyX','X'],['KeyC','C'],['KeyV','V'],['KeyB','B'],['KeyN','N'],['KeyM','M'],['Comma',','],['Period','.'],['Slash','-'],['ShiftRight','Maiusc dx']],
    [['ControlLeft','Ctrl sx'],['MetaLeft','Win'],['AltLeft','Alt'],['Space','Spazio'],['AltRight','Alt Gr'],['ControlRight','Ctrl dx'],['ArrowLeft','&larr;'],['ArrowUp','&uarr;'],['ArrowDown','&darr;'],['ArrowRight','&rarr;']],
    [['Home','Home'],['End','Fine'],['PageUp','PgSu'],['PageDown','PgGiu'],['Insert','Ins'],['PrintScreen','Stamp'],['NumLock','Bloc Num'],['NumpadDivide','/'],['NumpadMultiply','*'],['NumpadSubtract','-'],['NumpadAdd','+'],['NumpadEnter','Invio num']],
    [['Numpad0','N0'],['Numpad1','N1'],['Numpad2','N2'],['Numpad3','N3'],['Numpad4','N4'],['Numpad5','N5'],['Numpad6','N6'],['Numpad7','N7'],['Numpad8','N8'],['Numpad9','N9'],['NumpadDecimal','N.']]
  ];
  var cont = document.getElementById('tastiera'), tasti = {}, fatti = {}, n = 0, tot = 0;
  righe.forEach(function (r) {
    var div = document.createElement('div'); div.className = 'riga';
    r.forEach(function (k) {
      var t = document.createElement('div'); t.className = 't'; t.innerHTML = k[1];
      if (k[0] === 'Space') { t.style.flexGrow = 5; }
      if (k[0] === 'Backspace' || k[0] === 'Enter' || k[0].indexOf('Shift') === 0 || k[0] === 'CapsLock') { t.style.flexGrow = 1.8; }
      div.appendChild(t); tasti[k[0]] = t; tot++;
    });
    cont.appendChild(div);
  });
  document.getElementById('totale').textContent = tot + ' (il tastierino numerico puo\' mancare)';
  function giu(e) {
    e.preventDefault();
    var t = tasti[e.code];
    document.getElementById('ultimo').textContent = e.code + (e.key ? ' (' + e.key + ')' : '');
    if (!t) { return; }
    t.classList.add('premuto');
    if (!fatti[e.code]) { fatti[e.code] = true; n++; document.getElementById('conta').textContent = n; }
  }
  function su(e) {
    e.preventDefault();
    var t = tasti[e.code];
    if (t) { t.classList.remove('premuto'); t.classList.add('ok'); }
  }
  window.addEventListener('keydown', giu);
  window.addEventListener('keyup', su);
  // Stamp genera solo keyup in alcuni browser
  window.addEventListener('keyup', function (e) {
    if (e.code === 'PrintScreen' && !fatti[e.code]) { fatti[e.code] = true; n++; document.getElementById('conta').textContent = n; }
  });
</script>
</body>
</html>
